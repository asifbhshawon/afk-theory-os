services:
  db:
    image: postgres:16-alpine
    container_name: afk_business_os_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: afk_business_os
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - afk_business_os_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d afk_business_os"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - afk_network

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: afk_business_os_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-postgres}@db:5432/afk_business_os
      NODE_ENV: production
      PORT: 3000
      APP_URL: ${APP_URL:-http://localhost:3000}
      SESSION_SECRET: ${SESSION_SECRET:-afk-theory-session-secret-local-production-key-must-be-min-64-characters-long-2026}
      STORAGE_DIR: /app/storage
      BACKUP_DIR: /app/backups
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-afk-theory-secure-local-backup-key-2026}
    ports:
      - "${HOST_BINDING:-127.0.0.1}:${PORT:-3000}:3000"
    volumes:
      - afk_business_os_storage:/app/storage
      - afk_business_os_backups:/app/backups
    networks:
      - afk_network

volumes:
  afk_business_os_pgdata:
    name: afk_business_os_pgdata
  afk_business_os_storage:
    name: afk_business_os_storage
  afk_business_os_backups:
    name: afk_business_os_backups

networks:
  afk_network:
    name: afk_business_os_network
